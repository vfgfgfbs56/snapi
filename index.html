<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Системная палитра</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .color-button {
      width: 180px;
      height: 54px;
      border: 0;
      border-radius: 14px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    /* Сам input не удаляем через display:none,
       иначе на некоторых устройствах палитра может не открыться */
    #deviceColorPicker {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      left: 50%;
      top: 50%;
    }
  </style>
</head>

<body>

  <button class="color-button" id="openColorPicker">
    Выбрать цвет
  </button>

  <input
    type="color"
    id="deviceColorPicker"
    value="#ff0000"
  >

  <script>
    const button = document.getElementById('openColorPicker');
    const colorPicker = document.getElementById('deviceColorPicker');

    button.addEventListener('click', () => {
      colorPicker.click();
    });

    colorPicker.addEventListener('input', () => {
      const color = colorPicker.value;

      console.log('Выбран цвет:', color);

      button.style.background = color;
    });
  </script>

</body>
</html>
