<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Цвет iPhone</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f5f5f5;

      font-family: Arial, sans-serif;
    }

    .color-button {
      position: relative;

      width: 200px;
      height: 56px;

      border-radius: 16px;

      background: #111;
      color: #fff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 16px;
      font-weight: 600;

      overflow: hidden;
    }

    /*
      ВАЖНО:
      input реально находится поверх кнопки.

      Не display:none.
      Не вызываем .click().
      Пользователь нажимает прямо на input.
    */
    .color-button input[type="color"] {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      opacity: 0;

      cursor: pointer;

      border: 0;
      padding: 0;
    }
  </style>
</head>

<body>

  <div class="color-button" id="colorButton">

    <span id="buttonText">
      Выбрать цвет2
    </span>

    <input
      id="colorPicker"
      type="color"
      value="#ff0000"
    >

  </div>


  <script>
    const picker = document.getElementById('colorPicker');
    const button = document.getElementById('colorButton');
    const text = document.getElementById('buttonText');

    picker.addEventListener('input', () => {

      const color = picker.value;

      console.log('Цвет:', color);

      button.style.backgroundColor = color;

      text.textContent = color;

    });
  </script>

</body>
</html>
