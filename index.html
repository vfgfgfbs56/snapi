<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">

  <title>Snapi — тест скачивания</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --card: #151821;
      --card-2: #1c202b;
      --text: #ffffff;
      --muted: #8f96a8;
      --blue: #4f7cff;
      --blue-hover: #638cff;
      --border: rgba(255,255,255,.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .app {
      width: min(100%, 520px);
    }

    .title {
      margin: 0 0 8px;
      font-size: clamp(26px, 6vw, 38px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .result {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card);
      box-shadow: 0 20px 60px rgba(0,0,0,.28);
    }

    .canvas-wrap {
      overflow: hidden;
      border-radius: 17px;
      background: var(--card-2);
      aspect-ratio: 1 / 1;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .download-btn {
      appearance: none;
      width: 100%;
      min-height: 54px;
      margin-top: 14px;
      border: 0;
      border-radius: 16px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform .15s ease,
        background .15s ease,
        opacity .15s ease;
      touch-action: manipulation;
    }

    .download-btn:hover {
      background: var(--blue-hover);
    }

    .download-btn:active {
      transform: scale(.985);
    }

    .download-btn:disabled {
      cursor: default;
      opacity: .65;
    }

    .status {
      min-height: 20px;
      margin: 12px 4px 0;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
    }

    .status.ok {
      color: #65d98b;
    }

    .status.error {
      color: #ff7676;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1 class="title">Тест скачивания Snapi</h1>
    <p class="subtitle">
      Тестовая работа создаётся прямо в браузере. Нажмите кнопку ниже и проверьте скачивание PNG.
    </p>

    <section class="result">
      <div class="canvas-wrap">
        <canvas id="resultCanvas" width="1200" height="1200"></canvas>
      </div>

      <button id="downloadBtn" class="download-btn" type="button">
        Скачать работу
      </button>

      <div id="status" class="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('resultCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');

    /*
      ---------------------------------------------------------
      1. ТЕСТОВАЯ РАБОТА
      ---------------------------------------------------------
      Здесь позже можно заменить drawTestWork() на вашу настоящую
      функцию отрисовки результата Snapi.
    */
    function drawTestWork() {
      const w = canvas.width;
      const h = canvas.height;

      const gradient = ctx.createLinearGradient(0, 0, w, h);
      gradient.addColorStop(0, '#3858ff');
      gradient.addColorStop(0.5, '#7048ff');
      gradient.addColorStop(1, '#151b3d');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);

      // Свет по центру
      const glow = ctx.createRadialGradient(
        w * 0.5, h * 0.48, 10,
        w * 0.5, h * 0.48, w * 0.55
      );
      glow.addColorStop(0, 'rgba(255,255,255,.30)');
      glow.addColorStop(1, 'rgba(255,255,255,0)');

      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);

      // Декоративная карточка
      const cardX = 145;
      const cardY = 255;
      const cardW = 910;
      const cardH = 600;
      const radius = 70;

      roundRect(ctx, cardX, cardY, cardW, cardH, radius);

      ctx.fillStyle = 'rgba(15,18,34,.64)';
      ctx.fill();

      ctx.strokeStyle = 'rgba(255,255,255,.16)';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 104px Arial, sans-serif';
      ctx.fillText('SNAPI', w / 2, 480);

      ctx.fillStyle = 'rgba(255,255,255,.72)';
      ctx.font = '500 42px Arial, sans-serif';
      ctx.fillText('Тестовая работа', w / 2, 585);

      ctx.fillStyle = '#ffffff';
      ctx.font = '700 34px Arial, sans-serif';
      ctx.fillText('snapi.online', w / 2, 740);
    }

    function roundRect(context, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);

      context.beginPath();
      context.moveTo(x + r, y);
      context.arcTo(x + width, y, x + width, y + height, r);
      context.arcTo(x + width, y + height, x, y + height, r);
      context.arcTo(x, y + height, x, y, r);
      context.arcTo(x, y, x + width, y, r);
      context.closePath();
    }

    /*
      ---------------------------------------------------------
      2. CANVAS -> PNG BLOB
      ---------------------------------------------------------
    */
    function canvasToBlob(canvasElement) {
      return new Promise((resolve, reject) => {
        if (canvasElement.toBlob) {
          canvasElement.toBlob((blob) => {
            if (blob) {
              resolve(blob);
            } else {
              reject(new Error('Не удалось создать PNG.'));
            }
          }, 'image/png', 1);
          return;
        }

        // Fallback для очень старых браузеров
        try {
          const dataURL = canvasElement.toDataURL('image/png');
          const byteString = atob(dataURL.split(',')[1]);
          const mimeString = dataURL.split(',')[0].split(':')[1].split(';')[0];

          const buffer = new ArrayBuffer(byteString.length);
          const bytes = new Uint8Array(buffer);

          for (let i = 0; i < byteString.length; i++) {
            bytes[i] = byteString.charCodeAt(i);
          }

          resolve(new Blob([buffer], { type: mimeString }));
        } catch (error) {
          reject(error);
        }
      });
    }

    /*
      ---------------------------------------------------------
      3. СКАЧИВАНИЕ
      ---------------------------------------------------------
      Работает на GitHub Pages / snapi.online без PHP и сервера.
    */
    async function downloadWork() {
      const fileName = 'snapi-work.png';

      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Подготавливаем...';

      status.className = 'status';
      status.textContent = '';

      try {
        const blob = await canvasToBlob(canvas);

        /*
          iPhone / iPad:
          Отправляем PNG напрямую в Cloudflare Worker.
          Worker сразу возвращает файл как attachment,
          поэтому Share Sheet больше не вызывается.
        */
        if (isIOS()) {
          submitIOSDownload(canvas);
          setStatus('Скачивание запущено.', 'ok');
          return;
        }

        // Windows / Android — старая логика без изменений.
        triggerBlobDownload(blob, fileName);
        setStatus('Скачивание запущено.', 'ok');

      } catch (error) {
        console.error(error);

        /*
          Последний fallback:
          откроем PNG в новой вкладке.
          Это полезно для некоторых версий мобильного Safari.
        */
        try {
          const dataURL = canvas.toDataURL('image/png');
          const opened = window.open(dataURL, '_blank');

          if (!opened) {
            throw new Error('Браузер заблокировал открытие файла.');
          }

          setStatus(
            'PNG открыт в новой вкладке. На телефоне удерживайте изображение для сохранения.',
            'ok'
          );
        } catch (fallbackError) {
          console.error(fallbackError);
          setStatus('Не удалось скачать файл в этом браузере.', 'error');
        }

      } finally {
        downloadBtn.disabled = false;
        downloadBtn.textContent = 'Скачать работу';
      }
    }

    function submitIOSDownload(canvasElement) {
      const imageData = canvasElement.toDataURL('image/png');
      const form = document.createElement('form');

      form.method = 'POST';
      form.action = 'https://snapi-download.cloudtoptop256.workers.dev/download';
      form.style.display = 'none';

      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = 'image';
      input.value = imageData;

      form.appendChild(input);
      document.body.appendChild(form);

      form.submit();

      setTimeout(() => {
        form.remove();
      }, 1000);
    }

    function triggerBlobDownload(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      link.href = url;
      link.download = fileName;
      link.rel = 'noopener';
      link.style.display = 'none';

      document.body.appendChild(link);
      link.click();
      link.remove();

      // Не удаляем URL мгновенно — Safari иногда не успевает его обработать.
      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 15000);
    }

    function isIOS() {
      return (
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (
          navigator.platform === 'MacIntel' &&
          navigator.maxTouchPoints > 1
        )
      );
    }

    function setStatus(message, type = '') {
      status.className = 'status' + (type ? ' ' + type : '');
      status.textContent = message;
    }

    downloadBtn.addEventListener('click', downloadWork);

    drawTestWork();
  </script>
</body>
</html>
